name: Deploy homepage staging

on:
  push:
    branches: [agent/homecu]
  workflow_dispatch:

concurrency:
  group: staging-homecu-kimthanhtinlogistics
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Inspect safe application metadata
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -eu
          php -v | head -1
          for item in artisan composer.json bootstrap/app.php public/index.php routes/web.php vendor/autoload.php; do
            if test -e "$DEPLOY_PATH/$item"; then echo "present $item"; else echo "missing $item"; fi
          done
          find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
          stat -c '%A %U:%G %n' "$DEPLOY_PATH" "$DEPLOY_PATH/public" "$DEPLOY_PATH/storage" "$DEPLOY_PATH/bootstrap/cache"
          cd "$DEPLOY_PATH"
          php artisan route:list 2>/dev/null | head -60 || true
          if sudo -n true 2>/dev/null; then echo 'passwordless-sudo yes'; else echo 'passwordless-sudo no'; fi
          grep -RhsE 'server_name[[:space:]]+kimthanhtinlogistics\.vn|^[[:space:]]*root[[:space:]]|try_files|location[[:space:]]' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -80 || true
          REMOTE

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate homepage bundle
        run: |
          test -s public/homecu/index.html
          test -s public/homecu/styles.css
          test -s public/homecu/script.js
          grep -q 'styles.css' public/homecu/index.html
          grep -q 'script.js' public/homecu/index.html

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Create staging directory
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/public/homecu'"

      - name: Upload homepage staging bundle
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          scp -P "$DEPLOY_PORT" -i ~/.ssh/deploy_key -r \
            public/homecu/. \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/public/homecu/"

      - name: Verify staging page
        run: |
          curl --fail --silent --show-error --retry 5 \
            https://kimthanhtinlogistics.vn/homecu/ > /dev/null
